<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="setara-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EA580C" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>
    <linearGradient id="glow-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F97316" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#D97706" stop-opacity="0.8" />
    </linearGradient>
  </defs>
  
  <!-- Rounded Background Container -->
  <rect x="15" y="15" width="170" height="170" rx="42" fill="url(#setara-grad)" />
  <rect x="20" y="20" width="160" height="160" rx="38" fill="#0B0F19" />
  
  <!-- Stylized Equal Sign + Hands Gesture Graphic -->
  <!-- Top Bar: Hand / Wave motif -->
  <rect x="52" y="66" width="96" height="24" rx="12" fill="url(#setara-grad)" />
  <circle cx="64" cy="78" r="5" fill="#FFFFFF" />
  
  <!-- Bottom Bar: Inclusive bridge motif -->
  <rect x="52" y="110" width="96" height="24" rx="12" fill="url(#setara-grad)" />
  <circle cx="136" cy="122" r="5" fill="#FFFFFF" />
  
  <!-- Central Connection Pulse -->
  <circle cx="100" cy="100" r="7" fill="#F59E0B" />
</svg>
